name: daily

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch:
    inputs:
      date:
        description: "Day to collect (YYYY-MM-DD). Empty means yesterday in JST."
        required: false

permissions:
  contents: write

# daily and weekly both commit to data/, so never run them at the same time
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Collect
        env:
          DATE: ${{ inputs.date }}
        run: uv run python collect.py ${DATE:+--date "$DATE"}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../data/daily
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: 일일 논문 수집"
          git pull --rebase
          git push
