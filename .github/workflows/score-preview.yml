name: score-preview

# 지정한 날짜를 채점해서 결과를 로그로만 보여 준다. 저장소에는 커밋하지 않는다.
# profile.yaml이나 채점 기준을 바꾼 뒤 결과를 미리 확인할 때 쓴다.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "채점할 날짜 (YYYY-MM-DD)"
        required: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    env:
      DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Score
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python score.py --date "$DATE"

      - name: Show results
        run: |
          uv run python - <<'EOF'
          import json
          import os

          items = json.load(open(f"../data/daily/{os.environ['DATE']}.json"))["items"]
          scored = [item for item in items if "score" in item]
          for item in sorted(scored, key=lambda i: i["score"]["relevance"], reverse=True):
              print(f"{item['score']['relevance']:>3}  {item['title'][:60]:<60}  {item['score']['reason']}")
          EOF
