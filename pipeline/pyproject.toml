[project]
name = "ai-trend-digest-pipeline"
version = "0.1.0"
description = "Collect, score, and publish the weekly AI trend digest"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
